services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: __DB_NAME__
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5555:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d __DB_NAME__']
      interval: 5s
      timeout: 5s
      retries: 5
