[package]
name = "smoke-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "smoke_rs"
path = "src/lib.rs"

[[bin]]
name = "smoke"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
futures-util = "0.3"
serde_json = "1"
# native-tls uses the OS trust store (incl. any corporate MITM proxy CA),
# unlike the default rustls+webpki bundle which rejects intercepted certs.
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"

[profile.release]
opt-level = 2
